# ups-agent: managed by install.sh — edits here are overwritten on reinstall.
# Tunables live in /etc/ups-agent/install.env (see README).

[@UPS_NAME@]
    driver = usbhid-ups
    port = auto
    vendorid = 0764
    desc = "@UPS_DESC@"

    # Seconds between full USB polls / quick status polls. CyberPower units
    # disconnect if hammered, so keep these relaxed.
    pollfreq = 30
    pollinterval = 5

    # Ignore the UPS's own (late, ~10%) low-battery flag and let NUT raise LB
    # from the thresholds below instead.
    ignorelb
    override.battery.charge.low = @CHARGE_LOW@
    override.battery.runtime.low = @RUNTIME_LOW@

    # When the OS issues the final "shutdown.return" at halt time:
    #  offdelay = seconds until the UPS cuts its outlets
    #  ondelay  = seconds until it restores them IF utility power is present
    # If utility power is absent the outlets stay off until it returns, which
    # (with BIOS "AC BACK = Always On") boots the rig.
    offdelay = @OFFDELAY@
    ondelay = @ONDELAY@
