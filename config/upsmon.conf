# ups-agent: managed by install.sh - edits here are overwritten on reinstall.

MONITOR @UPS_NAME@@localhost 1 upsmon @UPSMON_PASSWORD@ primary
MINSUPPLIES 1

# Runs when the UPS reports OB+LB (on battery AND low battery). upsmon writes
# POWERDOWNFLAG first; at the very end of the halt, nutshutdown sees the flag
# and tells the UPS to cut its outlets (see README "How the shutdown works").
SHUTDOWNCMD "/sbin/shutdown -h +0 'ups-agent: UPS on battery and low, shutting down'"
POWERDOWNFLAG /etc/killpower

# Every event goes to syslog/journal, to logged-in users, and to upssched,
# which handles timers and writes /var/log/ups-agent/events.log.
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONLINE   SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG FSD      SYSLOG+WALL+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT SYSLOG+WALL+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+WALL+EXEC
NOTIFYFLAG NOPARENT SYSLOG+EXEC

NOTIFYMSG ONLINE   "ups-agent: UPS %s back on utility power"
NOTIFYMSG ONBATT   "ups-agent: UPS %s ON BATTERY - utility power lost"
NOTIFYMSG LOWBATT  "ups-agent: UPS %s battery LOW - shutdown imminent"
NOTIFYMSG FSD      "ups-agent: UPS %s forced shutdown in progress"
NOTIFYMSG COMMOK   "ups-agent: communication with UPS %s established"
NOTIFYMSG COMMBAD  "ups-agent: communication with UPS %s lost"
NOTIFYMSG SHUTDOWN "ups-agent: system is shutting down (UPS %s)"
NOTIFYMSG REPLBATT "ups-agent: UPS %s battery needs replacement"
NOTIFYMSG NOCOMM   "ups-agent: UPS %s unavailable"
NOTIFYMSG NOPARENT "ups-agent: upsmon parent process died - shutdown impossible"

POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
RBWARNTIME 43200
NOCOMMWARNTIME 300
# Seconds to wait after the SHUTDOWN notice before running SHUTDOWNCMD.
FINALDELAY 5
