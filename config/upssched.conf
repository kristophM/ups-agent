# ups-agent: managed by install.sh — edits here are overwritten on reinstall.
CMDSCRIPT /usr/local/lib/ups-agent/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Backstop: if we have been on battery for ONBATT_SHUTDOWN_SECS straight,
# shut down even if the charge/runtime thresholds have not tripped yet.
# A short blip (power back before the timer fires) cancels it — no shutdown.
AT ONBATT * START-TIMER onbatt-shutdown @ONBATT_SHUTDOWN_SECS@
AT ONLINE * CANCEL-TIMER onbatt-shutdown online

# Everything else is logged immediately.
AT ONBATT   * EXECUTE onbatt
AT ONLINE   * EXECUTE online
AT LOWBATT  * EXECUTE lowbatt
AT FSD      * EXECUTE fsd
AT COMMOK   * EXECUTE commok
AT COMMBAD  * EXECUTE commbad
AT SHUTDOWN * EXECUTE shutdown
AT REPLBATT * EXECUTE replbatt
AT NOCOMM   * EXECUTE nocomm
AT NOPARENT * EXECUTE noparent
